name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
